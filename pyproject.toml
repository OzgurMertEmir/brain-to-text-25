[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
lm-decoder = { path = "language_model/runtime/server/x86", editable = true, marker = "python_version < '3.10'" }
torch = [
  # 1. CUDA 12.6 for main env only (Python >= 3.11, Linux or Windows)
  { index = "pytorch-cu126", marker = "python_version >= '3.11' and (sys_platform == 'linux' or sys_platform == 'win32')" },
  # 2. CPU for LM env only (Python < 3.10, all platforms)
  { index = "pytorch-cpu", marker = "python_version < '3.10'" },
  # 3. CPU for macOS when Python >= 3.10
  { index = "pytorch-cpu", marker = "python_version >= '3.10' and sys_platform == 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cpu",  marker = "sys_platform == 'darwin'" },
]

